[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacodexion"
version = "0.3.0"
description = "Runner and validator for Codexion project test cases."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "pacodexion" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
]

[project.scripts]
pacodexion = "pacodexion.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
